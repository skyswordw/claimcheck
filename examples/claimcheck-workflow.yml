# Copy this into .github/workflows/claimcheck.yml in your repo.
name: claimcheck
on: [pull_request]
permissions:
  pull-requests: write   # to post the receipt comment
jobs:
  claimcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Option A: the composite action (posts a receipt comment)
      - uses: skyswordw/claimcheck@main
        # with:
        #   fail-on-refuted: "true"   # block the PR if a checkable claim is false

      # Option B (equivalent, no comment): plain npx
